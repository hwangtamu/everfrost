<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1512">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Everfrost — an idle hack-and-slash. Carve through packs, chase loot, shape a build with skills, runes and a passive tree, and keep growing while away.">
  <title>Everfrost — Idle Hack &amp; Slash</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
  <link rel="stylesheet" href="./game.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="battle-canvas" aria-label="Battlefield. Tap the ground to move or an enemy to target it."></canvas>
    <div class="vignette"></div>

    <header id="hud-top">
      <button id="stage-chip" data-act="open" data-arg="world" aria-label="Stage and world map">
        <span><small id="region-name">Mistwood</small><b id="stage-label">Stage 1</b></span>
        <span class="seal" title="Guardian seal"><i id="seal-bar"></i></span>
      </button>
      <button id="mode-btn" class="hud-btn" data-act="toggle-advance"></button>
      <span class="spacer"></span>
      <span class="gold-chip"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z M15 8h-5a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H9 M12 6v12"/></svg><b id="gold">0</b></span>
      <button id="speed-btn" class="hud-btn" data-act="speed" aria-label="Battle speed">1×</button>
      <button id="pause-btn" class="hud-btn" data-act="pause" aria-label="Pause or resume"></button>
      <button class="hud-btn" data-act="open" data-arg="menu" aria-label="Menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg></button>
    </header>

    <button id="target" data-act="dossier" hidden aria-label="Target details">
      <span class="target-row"><b id="target-name"></b><span id="target-mods"></span></span>
      <span class="target-track"><i id="target-bar"></i></span>
    </button>
    <canvas id="minimap" width="184" height="136" data-act="big-map" role="button" tabindex="0" aria-label="Open the map"></canvas>

    <div id="banner" class="banner" role="status" aria-live="polite"></div>
    <div id="feed" aria-hidden="true"></div>
    <div id="overlay" hidden></div>

    <footer id="hud-bottom">
      <div class="orb hp" id="hp-orb" aria-label="Health"><i id="hp-fill"></i><span id="hp-text"></span></div>
      <div class="hud-mid">
        <div id="skillbar"></div>
        <div class="xp" aria-label="Experience"><i id="xp-bar"></i><span id="level-text">Lv 1</span></div>
      </div>
      <div class="orb mp" id="mp-orb" aria-label="Mana"><i id="mp-fill"></i><span id="mp-text"></span></div>
    </footer>

    <nav id="dock" aria-label="Panels">
      <button id="dock-hero" data-act="open" data-arg="hero"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 22v-3a8 6 0 0 1 16 0v3"/></svg><span>Hero</span><i class="badge" hidden></i></button>
      <button id="dock-bag" data-act="open" data-arg="bag"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 7h14l2 14H3Z M8 7V5a4 4 0 0 1 8 0v2"/></svg><span>Bag</span><i class="badge" hidden></i></button>
      <button id="dock-skills" data-act="open" data-arg="skills"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7Z"/></svg><span>Skills</span><i class="badge" hidden></i></button>
      <button id="dock-tree" data-act="open" data-arg="tree"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z M5 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z M19 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z M12 7v5 M12 12l-6 5 M12 12l6 5"/></svg><span>Passives</span><i class="badge" hidden></i></button>
      <button id="dock-forge" data-act="open" data-arg="forge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m14 3 7 7-3 3-7-7Z M13 9 3 19l2 2L15 11 M10 2l12 12"/></svg><span>Forge</span><i class="badge" hidden></i></button>
      <button id="dock-world" data-act="open" data-arg="world"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3Z M9 2v17 M15 5v17"/></svg><span>World</span><i class="badge" hidden></i></button>
    </nav>

    <aside id="sheet" hidden aria-labelledby="sheet-title">
      <header><h2 id="sheet-title"></h2><button class="icon-btn" data-act="close-sheet" aria-label="Close panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12 M18 6 6 18"/></svg></button></header>
      <div id="sheet-body" class="sheet-body"></div>
    </aside>
  </main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <noscript>Everfrost needs JavaScript to run.</noscript>
</body>
</html>
